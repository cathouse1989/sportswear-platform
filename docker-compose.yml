# ============================================================
#  Sportswear 三项目统一编排
#  位置：项目根目录 D:\code\sportswear-platform
#  用法：docker compose up -d --build
# ============================================================

services:
  # ===================== 基础设施 =====================
  postgres:
    image: postgres:15-alpine
    container_name: sportswear-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportswear_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportswear-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sportswear-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

    # ==================== 后端 API（Go/Gin）====================
  backend:
    build:
      context: ./sportswear-backend
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    container_name: sportswear-backend
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sportswear_platform
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: sportswear
      MINIO_USE_SSL: "false"
      JWT_SECRET: docker-dev-secret-change-in-production
      JWT_EXPIRE_HOURS: "24"
      JWT_IDLE_TIMEOUT: "8"
      ADMIN_EMAIL: admin@sportswear.com
      ADMIN_PASSWORD: Admin@123456
    ports:
      - "8080:8080"
    volumes:
      # 本地存储降级方案的 uploads 目录必须持久化，否则容器重建后文件丢失、媒体记录变死链
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

    # ================== 管理后台（Vue3 SPA + nginx）==================
  admin:
    build:
      context: ./sportswear-admin
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    container_name: sportswear-admin
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped

    # ================== 门户前台（Nuxt3 SSR）==================
  portal:
    build:
      context: ./sportswear-portal
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-}
    container_name: sportswear-portal
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_SERVER: http://backend:8080/api/v1
      # SEO / Analytics（部署时替换为实际值）
      NUXT_PUBLIC_GA_MEASUREMENT_ID: ${NUXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://sportswear-platform.com}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads: