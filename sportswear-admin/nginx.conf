server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xhtml+xml
        image/svg+xml
        font/woff2;

    # API 反向代理到后端容器。
    # 使用 Docker 内置 DNS（127.0.0.11）动态解析 backend：
    # nginx 对静态 proxy_pass 会在启动时缓存 IP，后端容器重建换 IP 后会 502；
    # 改为变量 + resolver 后每次解析跟随最新 IP，容器重启/迁移不再出错。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # 带 hash 的构建产物（CSS/JS），可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片、字体等静态资源缓存
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html 不做缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}